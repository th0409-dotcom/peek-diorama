<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>のぞき窓ドッグファイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: 宇宙船の操縦席から窓の外を覗く。緊張感はあるが、手触りは軽い。
IDEA: スマホの画面＝操縦席の窓ガラス。
PICTURE: 全画面3D。手前に窓枠と計器盤、奥に岩と敵機と星。
COLOUR and TYPE: 宇宙の黒 #02030a、計器のシアン #4fe3ff、敵の赤 #ff4d5e、ビームの水色。Zen Maru Gothic。
LAYOUT: 左上にスコア、中央上に残り時間、右上にシールド、右下に感度と正面。
*/
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:"Zen Maru Gothic",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-weight:900;font-size:15px}
.pill{background:#000a;border:1px solid #4fe3ff55;border-radius:16px;padding:4px 12px;color:#bff5ff;font-variant-numeric:tabular-nums}
.shield i{display:inline-block;width:12px;height:12px;border-radius:3px;background:#4fe3ff;margin-left:4px;box-shadow:0 0 6px #4fe3ff}
.shield i.off{background:#23323a;box-shadow:none}
.call{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.85);font-weight:900;font-size:clamp(24px,5vw,44px);opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;text-shadow:0 2px 12px #000}
.call.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ui{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:5}
.ui label{background:#000a;border:1px solid #4fe3ff44;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:900;display:flex;gap:8px;align-items:center;min-height:40px}
.ui input{width:110px;accent-color:#4fe3ff}
.ui button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid #4fe3ff55;background:#000a;color:#fff;font:inherit;font-weight:900;font-size:13px;cursor:pointer}
.fps{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));font-size:11px;color:#8fb;opacity:.7;pointer-events:none}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#000c;z-index:10;padding:20px}
.overlay[hidden]{display:none}
.card{background:#0a1020;border:1px solid #4fe3ff55;border-radius:18px;padding:22px 26px;max-width:min(540px,92vw);text-align:center;box-shadow:0 0 40px #4fe3ff22}
.card h1{margin:0 0 6px;font-size:clamp(24px,4.5vw,36px);font-weight:900}
.card p{margin:8px 0;font-size:15px;line-height:1.55;color:#cfeff7}
.card .sub{font-size:13px;opacity:.7}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{min-height:48px;padding:0 22px;border-radius:24px;border:0;font:inherit;font-weight:900;font-size:16px;cursor:pointer;background:#4fe3ff;color:#02202a}
.btn.sec{background:#14203a;color:#fff;border:1px solid #4fe3ff66}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.rotate{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:#000e;text-align:center;font-weight:900;font-size:20px}
@media (orientation:portrait){.rotate.show{display:grid}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span class="pill" id="score">撃墜 0</span><span class="pill" id="time">60</span><span class="pill shield" id="shield">シールド</span></div>
<div class="call" id="call"></div>
<div class="fps" id="fps"></div>
<div class="ui"><label>感度<input type="range" id="sens" min="0.6" max="2.6" step="0.1" value="1.5"></label><button id="recenter">正面</button></div>
<div class="overlay" id="start">
  <div class="card">
    <h1>のぞき窓ドッグファイト</h1>
    <p>画面は宇宙船の窓。敵の弾は、あなたの顔めがけて飛んできます。<br><b>顔を動かしてよけて、敵をタップして撃ち返そう。</b></p>
    <p class="sub">スマホを横にして、30cmくらい離して両手で持ってね。岩の陰の敵は、覗き込むと見えます。カメラの映像は端末の中だけで使います。</p>
    <div class="btns"><button class="btn" id="goFace">カメラで遊ぶ</button><button class="btn sec" id="goTouch">指で試す</button></div>
  </div>
</div>
<div class="overlay" id="end" hidden>
  <div class="card"><h1 id="endTitle">帰還！</h1><p id="endText"></p><div class="btns"><button class="btn" id="again">もう一度</button></div></div>
</div>
<div class="rotate show" id="rotate"><div>スマホを横にしてね</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030a);
const camera=new THREE.PerspectiveCamera(30,16/9,0.05,400);

/* ---------- window camera (1 unit = half screen height, phone ~35cm away) ---------- */
const EYE0={x:0,y:0,z:10};const eye={...EYE0},target={...EYE0};window.__target=target;
let hw=2,hh=1,shake=0;
function updateCamera(){const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  camera.position.set(eye.x+sx,eye.y+sy,eye.z);camera.quaternion.identity();camera.updateMatrixWorld();
  const n=camera.near,k=n/eye.z,ex=eye.x+sx,ey=eye.y+sy;
  camera.projectionMatrix.makePerspective((-hw-ex)*k,(hw-ex)*k,(hh-ey)*k,(-hh-ey)*k,n,camera.far);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();}

/* ---------- far: stars + nebula ---------- */
{const N=2600,p=new Float32Array(N*3),c=new Float32Array(N*3);
 for(let i=0;i<N;i++){const z=-40-Math.random()*300,sp=Math.abs(z)*1.1;p[i*3]=(Math.random()*2-1)*sp;p[i*3+1]=(Math.random()*2-1)*sp*.6;p[i*3+2]=z;const t=.6+Math.random()*.4,b=Math.random();c[i*3]=t*(b>.85?1:.8);c[i*3+1]=t*.9;c[i*3+2]=t*(b<.2?1:.95);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.6,sizeAttenuation:false,vertexColors:true})));}
function blobTex(stops){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const r=g.createRadialGradient(128,128,0,128,128,128);stops.forEach(([o,col])=>r.addColorStop(o,col));g.fillStyle=r;g.fillRect(0,0,256,256);return new THREE.CanvasTexture(c);}
[[-60,25,-260,240,['0','rgba(120,60,200,.55)'],['1','rgba(40,10,80,0)']],[90,-30,-280,260,['0','rgba(30,120,200,.45)'],['1','rgba(10,30,80,0)']],[10,60,-300,200,['0','rgba(200,70,140,.35)'],['1','rgba(60,10,40,0)']]]
 .forEach(([x,y,z,s,a,b])=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:blobTex([[+a[0],a[1]],[+b[0],b[1]]]),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));sp.position.set(x,y,z);sp.scale.set(s,s,1);scene.add(sp);});
const planet=new THREE.Mesh(new THREE.SphereGeometry(28,48,32),new THREE.MeshStandardMaterial({color:0x3a6ea8,roughness:.9,emissive:0x0a1830,emissiveIntensity:.6}));planet.position.set(70,-35,-200);scene.add(planet);

/* ---------- lights ---------- */
scene.add(new THREE.AmbientLight(0x223355,.6));
const sun=new THREE.DirectionalLight(0xfff0dd,0.9);sun.position.set(-40,30,20);scene.add(sun);
const rimL=new THREE.DirectionalLight(0x5a8cff,.5);rimL.position.set(30,-10,-20);scene.add(rimL);

/* ---------- asteroids at many depths (depth cues) ---------- */
const rocks=[];
function rockGeo(r){const g=new THREE.IcosahedronGeometry(r,2);const p=g.attributes.position,v=new THREE.Vector3();for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);v.multiplyScalar(1+(Math.sin(v.x*3.1)+Math.sin(v.y*4.7)+Math.sin(v.z*2.3))*.07+(Math.random()-.5)*.08);p.setXYZ(i,v.x,v.y,v.z);}g.computeVertexNormals();return g;}
const rockMat=new THREE.MeshStandardMaterial({color:0x6a645c,roughness:.95,flatShading:true});
function placeRock(o,far){o.position.set((Math.random()*2-1)*11,(Math.random()*2-1)*5.5,far?-55-Math.random()*20:-14-Math.random()*55);}
for(let i=0;i<18;i++){const r=.25+Math.random()*.8;const m=new THREE.Mesh(rockGeo(r),rockMat);placeRock(m,false);m.userData={spin:new THREE.Vector3(Math.random()*.4,Math.random()*.4,Math.random()*.4),r};scene.add(m);rocks.push(m);}

/* ---------- cockpit frame right behind the glass (strong near parallax) ---------- */
const cockpit=new THREE.Group();scene.add(cockpit);
const hullM=new THREE.MeshStandardMaterial({color:0x1c2230,roughness:.5,metalness:.6});
const trimM=new THREE.MeshStandardMaterial({color:0x2b3448,roughness:.35,metalness:.8});
const glowM=new THREE.MeshBasicMaterial({color:0x4fe3ff});
const gaugeTex=(()=>{const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle='#061018';g.fillRect(0,0,512,128);g.strokeStyle='#4fe3ff';g.lineWidth=3;
  for(let i=0;i<4;i++){g.beginPath();g.arc(64+i*128,64,40,Math.PI*.8,Math.PI*2.2);g.stroke();g.beginPath();g.moveTo(64+i*128,64);g.lineTo(64+i*128+Math.cos(-.6-i*.4)*34,64+Math.sin(-.6-i*.4)*34);g.stroke();}
  g.fillStyle='#ff4d5e';g.fillRect(470,20,24,10);g.fillStyle='#7dffb0';g.fillRect(470,40,24,10);return new THREE.CanvasTexture(c);})();
function buildCockpit(){
  cockpit.clear();const z0=-0.12;
  /* window frame: thick edges + diagonal corner struts */
  [[0,hh-.06,hw*2,.12],[0,-hh+.06,hw*2,.12],[-hw+.06,0,.12,hh*2],[hw-.06,0,.12,hh*2]].forEach(([x,y,w,h])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,.16),hullM);m.position.set(x,y,z0);cockpit.add(m);});
  [[-1,1],[1,1],[-1,-1],[1,-1]].forEach(([sx,sy])=>{const s=new THREE.Mesh(new THREE.BoxGeometry(.5,.07,.1),trimM);s.position.set(sx*(hw-.24),sy*(hh-.2),z0-.15);s.rotation.z=sx*sy*.75;cockpit.add(s);});
  /* centre strut at the top, going back */
  const strut=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,1.2),trimM);strut.position.set(0,hh-.08,-.6);cockpit.add(strut);
  /* dashboard along the bottom, a little behind the glass */
  const dash=new THREE.Mesh(new THREE.BoxGeometry(hw*2,.26,.7),hullM);dash.position.set(0,-hh+.12,-.45);cockpit.add(dash);
  const panel=new THREE.Mesh(new THREE.PlaneGeometry(Math.min(1.4,hw*.7),.3),new THREE.MeshBasicMaterial({map:gaugeTex}));panel.position.set(0,-hh+.25,-.11);panel.rotation.x=-.5;cockpit.add(panel);
  [-1,1].forEach(s=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.5,.012,.012),glowM);l.position.set(s*(hw-.6),-hh+.255,-.12);cockpit.add(l);});
  /* reticle floating just outside the glass */
  const ret=new THREE.Mesh(new THREE.RingGeometry(.1,.115,40),new THREE.MeshBasicMaterial({color:0x4fe3ff,transparent:true,opacity:.6,depthWrite:false}));ret.position.set(0,0,-2.5);cockpit.add(ret);
}

/* ---------- enemies ---------- */
const enemies=[];
const enemyBodyM=new THREE.MeshStandardMaterial({color:0x2a2f3a,roughness:.35,metalness:.8});
const enemyGlowM=new THREE.MeshBasicMaterial({color:0xff4d5e});
function makeEnemy(){const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.SphereGeometry(.38,24,16),enemyBodyM);body.scale.set(1,.7,1);g.add(body);
  const eyeL=new THREE.Mesh(new THREE.SphereGeometry(.12,16,12),enemyGlowM);eyeL.position.set(0,0,.33);g.add(eyeL);
  [-1,1].forEach(s=>{const w=new THREE.Mesh(new THREE.BoxGeometry(.9,.05,.4),enemyBodyM);w.position.set(s*.62,0,0);w.rotation.z=s*.15;g.add(w);
    const tip=new THREE.Mesh(new THREE.BoxGeometry(.05,.3,.3),enemyGlowM);tip.position.set(s*1.08,0,0);g.add(tip);});
  const hit=new THREE.Mesh(new THREE.SphereGeometry(.9,10,8),new THREE.MeshBasicMaterial({visible:false}));g.add(hit);g.userData.hitbox=hit;
  return g;}
function spawnEnemy(e){e.position.set((Math.random()*2-1)*6,(Math.random()*2-1)*2.6,-34-Math.random()*10);
  e.userData.home=new THREE.Vector3((Math.random()*2-1)*4.2,(Math.random()*2-1)*1.8,-12-Math.random()*12);
  e.userData.phase=Math.random()*10;e.userData.fireT=1.5+Math.random()*1.5;e.userData.dead=false;e.visible=true;}
for(let i=0;i<3;i++){const e=makeEnemy();spawnEnemy(e);scene.add(e);enemies.push(e);}

/* ---------- shots ---------- */
const glowTex=blobTex([[0,'rgba(255,255,255,1)'],[.25,'rgba(255,255,255,.6)'],[1,'rgba(255,255,255,0)']]);
const enemyShots=[];
function enemyFire(e){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xff5a6a,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));s.scale.set(.9,.9,1);
  const core=new THREE.Mesh(new THREE.SphereGeometry(.16,16,12),new THREE.MeshBasicMaterial({color:0xffd0d4}));s.add(core);
  const from=e.position.clone();const aim=new THREE.Vector3(eye.x,eye.y,eye.z);const dir=aim.sub(from).normalize();
  s.position.copy(from);scene.add(s);enemyShots.push({s,dir,speed:12});}
const beams=[],sparks=[],cracks=[];
const beamMat=new THREE.MeshBasicMaterial({color:0x9ff3ff,transparent:true,opacity:1});
function fireBeam(fromV,toV){const len=fromV.distanceTo(toV);const g=new THREE.CylinderGeometry(.025,.025,len,8);g.translate(0,len/2,0);g.rotateX(Math.PI/2);
  const m=new THREE.Mesh(g,beamMat.clone());m.position.copy(fromV);m.lookAt(toV);scene.add(m);beams.push({m,t:0});}
function burstAt(p,color,n=40){const pos=new Float32Array(n*3),vel=[];for(let i=0;i<n;i++){pos.set([p.x,p.y,p.z],i*3);vel.push(new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(2+Math.random()*4));}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({color,size:.22,map:glowTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(pts);sparks.push({pts,vel,t:0});}
const crackTex=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.strokeStyle='rgba(220,240,255,.9)';g.lineWidth=2;
  for(let i=0;i<11;i++){g.beginPath();g.moveTo(128,128);let x=128,y=128,a=i/11*Math.PI*2;for(let k=0;k<6;k++){a+=(Math.random()-.5)*.6;x+=Math.cos(a)*18;y+=Math.sin(a)*18;g.lineTo(x,y);}g.stroke();}
  g.beginPath();g.arc(128,128,22,0,7);g.stroke();g.beginPath();g.arc(128,128,48,0,7);g.globalAlpha=.5;g.stroke();return new THREE.CanvasTexture(c);})();
function crackAt(x,y){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:crackTex,transparent:true,depthWrite:false}));s.position.set(x,y,-.02);s.scale.set(1.1,1.1,1);scene.add(s);cracks.push({s,t:0});}

/* ---------- post ---------- */
const composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(800,400),.8,.4,.82);composer.addPass(bloom);

/* ---------- game state ---------- */
const GAME_T=60,MAX_SH=5;let playing=false,tLeft=GAME_T,score=0,shield=MAX_SH,callT=0;
function call(t,c){const e=$('call');e.textContent=t;e.style.color=c;e.classList.add('on');clearTimeout(callT);callT=setTimeout(()=>e.classList.remove('on'),550);}
function drawShield(){$('shield').innerHTML='シールド'+Array.from({length:MAX_SH},(_,i)=>'<i class="'+(i<shield?'':'off')+'"></i>').join('');}
function reset(){tLeft=GAME_T;score=0;shield=MAX_SH;drawShield();$('score').textContent='撃墜 0';enemies.forEach(spawnEnemy);
  enemyShots.splice(0).forEach(o=>scene.remove(o.s));cracks.splice(0).forEach(o=>scene.remove(o.s));}
function finish(win){playing=false;$('endTitle').textContent=win?'帰還！':'シールド切れ…';$('endText').textContent='撃墜 '+score+' 機'+(win?'　シールド残り '+shield:'');$('end').hidden=false;}
drawShield();

/* ---------- input: tap to shoot (finger mode: drag also moves the viewpoint) ---------- */
const rc=new THREE.Raycaster();
function shootAt(cx,cy){
  if(!playing)return;const r=canvas.getBoundingClientRect();const nd=new THREE.Vector2(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);
  rc.setFromCamera(nd,camera);
  const tg=[...rocks,...enemies.filter(e=>!e.userData.dead).map(e=>e.userData.hitbox)];
  const h=rc.intersectObjects(tg,false)[0];
  const from=new THREE.Vector3(eye.x*.6,-hh+.35,-.3);
  const to=h?h.point.clone():rc.ray.origin.clone().addScaledVector(rc.ray.direction,60);
  fireBeam(from,to);
  if(h){const e=enemies.find(e=>e.userData.hitbox===h.object);
    if(e){e.userData.dead=true;e.visible=false;burstAt(e.position,0xffa070,70);score++;$('score').textContent='撃墜 '+score;call('撃墜！','#ffd27a');setTimeout(()=>spawnEnemy(e),1400);}
    else burstAt(h.point,0xbbbbbb,18);}
}
let downPos=null,moved=0;
function setFromPointer(x,y){if(window.__faceOn)return;const nx=(x/innerWidth-.5)*2,ny=(y/innerHeight-.5)*2;target.x=nx*4.5;target.y=-ny*3;}
canvas.addEventListener('pointerdown',e=>{downPos={x:e.clientX,y:e.clientY};moved=0;});
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!e.buttons){setFromPointer(e.clientX,e.clientY);return;}if(!downPos)return;moved+=Math.hypot(e.movementX||0,e.movementY||0);if(!window.__faceOn&&moved>12)setFromPointer(e.clientX,e.clientY);});
canvas.addEventListener('pointerup',e=>{if(downPos&&moved<12)shootAt(e.clientX,e.clientY);downPos=null;});
$('recenter').onclick=()=>{Object.assign(target,EYE0);if(window.__faceReset)window.__faceReset();};
const sensEl=$('sens');try{const v=localStorage.getItem('peekSens');if(v)sensEl.value=v;}catch(e){}
window.__sens=+sensEl.value;sensEl.oninput=()=>{window.__sens=+sensEl.value;try{localStorage.setItem('peekSens',sensEl.value);}catch(e){}};
async function go(face){
  try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen({navigationUI:'hide'});}catch(e){}
  try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}
  $('start').hidden=true;reset();playing=true;if(face&&window.__startFace)window.__startFace();}
$('goFace').onclick=()=>go(true);$('goTouch').onclick=()=>go(false);
$('again').onclick=()=>{$('end').hidden=true;reset();playing=true;};
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);composer.setSize(w,h);hh=1;hw=w/h;bloom.resolution.set(w,h);buildCockpit();$('rotate').classList.toggle('show',h>w);}
addEventListener('resize',resize);resize();

/* ---------- loop ---------- */
const clock=new THREE.Clock();let tt=0;
function loop(){const dt=Math.min(clock.getDelta(),.05);tt+=dt;
  const sp=window.__faceOn?28:10;eye.x+=(target.x-eye.x)*Math.min(1,dt*sp);eye.y+=(target.y-eye.y)*Math.min(1,dt*sp);eye.z+=(target.z-eye.z)*Math.min(1,dt*sp*.6);
  shake*=Math.pow(.02,dt);updateCamera();
  /* rocks drift slowly toward you and recycle */
  rocks.forEach(r=>{r.rotation.x+=r.userData.spin.x*dt;r.rotation.y+=r.userData.spin.y*dt;r.position.z+=1.2*dt;if(r.position.z>-11)placeRock(r,true);});
  /* enemies weave around their home spot, sometimes ducking behind rocks */
  enemies.forEach(e=>{if(e.userData.dead)return;const u=e.userData;u.phase+=dt;
    const h=u.home;const tx=h.x+Math.sin(u.phase*.9)*1.6,ty=h.y+Math.sin(u.phase*1.3)*.7,tz=h.z+Math.sin(u.phase*.5)*3;
    e.position.x+=(tx-e.position.x)*dt*1.2;e.position.y+=(ty-e.position.y)*dt*1.2;e.position.z+=(tz-e.position.z)*dt*1.2;
    e.lookAt(eye.x,eye.y,eye.z);e.rotation.z+=Math.sin(u.phase*2)*.3;
    if(playing){u.fireT-=dt;if(u.fireT<=0){enemyFire(e);u.fireT=2.2+Math.random()*2.2;}}});
  /* enemy shots: judge when they reach the glass */
  for(let i=enemyShots.length-1;i>=0;i--){const o=enemyShots[i];o.s.position.addScaledVector(o.dir,o.speed*dt);
    if(o.s.position.z>=0){const p=o.s.position,t=(eye.z-p.z)/o.dir.z;const hx=p.x+o.dir.x*t,hy=p.y+o.dir.y*t;
      if(playing&&Math.hypot(hx-eye.x,(hy-eye.y)*1.3)<1.5){shield--;drawShield();crackAt(p.x,p.y);shake=.25;call('被弾！','#ff8a8a');if(navigator.vibrate)navigator.vibrate(80);if(shield<=0)finish(false);}
      else if(playing)call('回避','#7fe8ff');
      scene.remove(o.s);enemyShots.splice(i,1);}}
  for(let i=beams.length-1;i>=0;i--){const b=beams[i];b.t+=dt;b.m.material.opacity=Math.max(0,1-b.t/.18);if(b.t>.18){scene.remove(b.m);b.m.geometry.dispose();beams.splice(i,1);}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t+=dt;const a=s.pts.geometry.attributes.position;for(let k=0;k<s.vel.length;k++){a.array[k*3]+=s.vel[k].x*dt;a.array[k*3+1]+=s.vel[k].y*dt;a.array[k*3+2]+=s.vel[k].z*dt;}a.needsUpdate=true;s.pts.material.opacity=Math.max(0,1-s.t/.9);if(s.t>.9){scene.remove(s.pts);s.pts.geometry.dispose();sparks.splice(i,1);}}
  for(let i=cracks.length-1;i>=0;i--){const c=cracks[i];c.t+=dt;c.s.material.opacity=Math.max(0,1-Math.max(0,c.t-2.5)/1);if(c.t>3.5){scene.remove(c.s);cracks.splice(i,1);}}
  if(playing){tLeft-=dt;$('time').textContent=Math.max(0,Math.ceil(tLeft));if(tLeft<=0)finish(true);}
  if(window.__fps!==undefined)$('fps').textContent='顔認識 '+window.__fps+' 回/秒';
  composer.render();requestAnimationFrame(loop);}
loop();
window.__dbg={enemies,camera,shootAt};
}
</script>
<script type="module">
/* face tracking: low-res camera for more updates per second, little smoothing */
let running=false,video,lm,base=null;
window.__faceReset=()=>{base=null;};
window.__startFace=async()=>{
  const out=document.getElementById('fps');
  try{video=document.createElement('video');video.playsInline=true;video.muted=true;
    video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240},frameRate:{ideal:60}}});await video.play();
    const V=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs=await V.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    lm=await V.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1});
  }catch(e){out.textContent='カメラが使えません（'+(e.name||e.message||e)+'）。指で試せます';return;}
  running=true;window.__faceOn=true;base=null;const T=window.__target;let n=0,t0=performance.now();
  const step=()=>{const now=performance.now();n++;if(now-t0>1000){window.__fps=Math.round(n*1000/(now-t0));n=0;t0=now;}
    const r=lm.detectForVideo(video,now);const f=r.faceLandmarks&&r.faceLandmarks[0];
    if(f){const a=f[33],b=f[263];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const iod=Math.max(Math.hypot(a.x-b.x,a.y-b.y),.05);
      if(!base)base={x:mx,y:my,iod};const dx=mx-base.x,dy=my-base.y;const k=window.__sens||1.5;
      T.x=Math.max(-7,Math.min(7,-dx*11.5*k));T.y=Math.max(-4.5,Math.min(4.5,-dy*8.6*k));T.z=Math.max(5,Math.min(18,10*base.iod/iod));}};
  /* run once per new camera frame when the browser supports it */
  if(video.requestVideoFrameCallback){const vf=()=>{if(!running)return;step();video.requestVideoFrameCallback(vf);};video.requestVideoFrameCallback(vf);}
  else{let last=-1;const tick=()=>{if(!running)return;if(video.currentTime!==last){last=video.currentTime;step();}requestAnimationFrame(tick);};tick();}
};
</script>
